[project]
name = "redesmyn"
version = "0.1.0"
description = "Local-first cockpit for orchestrating multi-agent stacked-branch work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "typer>=0.13",
  "httpx>=0.27",
  "uvicorn[standard]>=0.32",
  "keyring>=25.0",
  "structlog>=25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
rn = "redesmyn.cli:main"

[dependency-groups]
dev = [
  "ruff",
  "ty",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["redesmyn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short -ra"
asyncio_mode = "auto"
timeout = 30
timeout_method = "thread"
markers = [
  "integration: exercises app + db + git",
  "unit: pure-ish helper tests",
]
