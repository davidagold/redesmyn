[project]
name = "redesmyn"
version = "0.1.0"
description = "Local-first cockpit for orchestrating multi-agent stacked-branch work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "typer>=0.13",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
rn = "redesmyn.cli:main"

[dependency-groups]
dev = [
  "alembic>=1.14",
  "httpx>=0.27",
  "ruff",
  "ty",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["redesmyn*"]
