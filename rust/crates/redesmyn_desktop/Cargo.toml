[package]
name = "redesmyn_desktop"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
gpui.workspace = true
prost.workspace = true
raw-window-handle = "0.6.2"
redesmyn_client_api.workspace = true
redesmyn_config.workspace = true
redesmyn_control_plane.workspace = true
redesmyn_daemon.workspace = true
redesmyn_ids.workspace = true
redesmyn_logging.workspace = true
redesmyn_protocol.workspace = true
redesmyn_storage.workspace = true
redesmyn_transport.workspace = true
redesmyn_ui.workspace = true
redesmyn_ui_graph.workspace = true
redesmyn_ui_session.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", features = ["objc2-quartz-core"] }
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }
