syntax = "proto3";

package redesmyn.protocol.v1;

import "envelope.proto";
import "google/protobuf/timestamp.proto";

// Artifact references and session event contracts (T-14).
//
// Key rule: do NOT embed large blobs in durable events. Durable session events
// must be compact and link to out-of-band content via `ArtifactRef`.

// Small, stable artifact kind enum. Additive changes are allowed.
enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_LOG = 1;
  ARTIFACT_KIND_DIFF = 2;
  ARTIFACT_KIND_PATCH = 3;
  ARTIFACT_KIND_FILE_SNAPSHOT = 4;
  ARTIFACT_KIND_TRACE = 5;
}

// Content hash for integrity/dedup. Algorithm is a stable string identifier.
message Hash {
  string algorithm = 1;
  bytes digest = 2;
}

// Storage backend is an implementation detail; hints are best-effort.
message StorageHint {
  oneof hint {
    string local_path = 1;
    string blob_key = 2;
  }
}

// Stable reference to content stored out-of-band.
message ArtifactRef {
  // ArtifactId (ULID bytes, length = 16).
  bytes artifact_id = 1;
  ArtifactKind kind = 2;
  Hash content_hash = 3;
  optional uint64 byte_len = 4;
  optional string mime = 5;
  StorageHint storage_hint = 6;
}

// Session events are durable, structured records for session viewer UX.
//
// Session semantics: session == conversation; turns are events.
// A structured "send message" should produce new turn events, not a new session.

// Session scope for querying: task-scoped sessions and user-managed chats.
message SessionScope {
  oneof kind {
    TaskScope task = 1;
    ChatScope chat = 2;
  }
}

message TaskScope {
  // TaskId (ULID bytes, length = 16).
  bytes task_id = 1;
}

// User-managed chat session scope. Pinned-to-epic relationships live elsewhere.
message ChatScope {}

// Session interface mode (structured vs interactive/tmux).
enum InterfaceMode {
  INTERFACE_MODE_UNSPECIFIED = 0;
  INTERFACE_MODE_INTERACTIVE = 1;
  INTERFACE_MODE_STRUCTURED = 2;
}

// Best-effort external session handle for structured agents.
message ExternalSessionRef {
  oneof ref {
    ExternalSessionNone none = 1;
    CodexThreadRef codex_thread = 2;
    ClaudeSessionRef claude_session = 3;
    CodexSessionRef codex_session = 4;
    UnknownExternalSessionRef unknown = 100;
  }
}

message ExternalSessionNone {}

message CodexThreadRef {
  // Stable external session id.
  string thread_id = 1;
  // Best-effort external turn id.
  optional string turn_id = 2;
}

message CodexSessionRef {
  // Stable external session id (app-server).
  string session_id = 1;
  // Best-effort external turn id.
  optional string turn_id = 2;
}

message ClaudeSessionRef {
  // Stable external session id.
  string session_id = 1;
}

message UnknownExternalSessionRef {
  string type = 1;
  bytes json_payload = 2;
}

// Durable session event record.
message SessionEvent {
  // SessionEventId (ULID bytes, length = 16).
  bytes session_event_id = 1;
  // Wall-clock timestamp for ordering/pagination.
  google.protobuf.Timestamp created_at = 2;

  SessionScope scope = 3;

  // SessionId (ULID bytes, length = 16): session identity.
  bytes session_id = 4;

  // Best-effort turn identifier; stable within an external harness when available.
  optional string turn_id = 5;

  oneof kind {
    SessionStarted session_started = 10;
    SessionEnded session_ended = 11;
    TurnStarted turn_started = 12;
    TurnCompleted turn_completed = 13;
    UserMessage user_message = 14;
    AssistantMessage assistant_message = 15;
    ToolInvocation tool_invocation = 16;
    ToolResult tool_result = 17;
    StatusUpdate status_update = 18;
    ArtifactEmitted artifact_emitted = 19;
    AssistantReasoning assistant_reasoning = 20;
    PermissionsModeChanged permissions_mode_changed = 21;
    PermissionRequested permission_requested = 22;
    PermissionDecided permission_decided = 23;
    UnknownSessionEvent unknown = 100;
  }
}

message SessionStarted {}

message SessionEnded {}

message TurnStarted {
  InterfaceMode interface_mode = 1;
  ExternalSessionRef external_session_ref = 2;
  optional string idempotency_key = 3;
  optional uint64 log_offset_bytes = 4;
}

message TurnCompleted {
  InterfaceMode interface_mode = 1;
  ExternalSessionRef external_session_ref = 2;
  optional int32 exit_code = 3;
  ErrorEnvelope error = 4;
}

// User message text is bounded; use `full_text_artifact` for large content.
message UserMessage {
  string text = 1;
  string preview = 2;
  ArtifactRef full_text_artifact = 3;
}

// Assistant message text is bounded; use `full_text_artifact` for large content.
message AssistantMessage {
  string text = 1;
  string preview = 2;
  ArtifactRef full_text_artifact = 3;
}

// Assistant reasoning is bounded; use artifacts for large content.
message AssistantReasoningText {
  string text = 1;
  string preview = 2;
  ArtifactRef full_text_artifact = 3;
}

// Structured assistant reasoning (summary + optional raw content).
message AssistantReasoning {
  // Provider-scoped item identifier (e.g. Codex app-server item id) used to correlate streaming
  // deltas with the durable event.
  optional string item_id = 1;
  // A short, user-facing summary of reasoning (bounded).
  AssistantReasoningText summary = 2;
  // Optional provider raw reasoning content (bounded).
  AssistantReasoningText raw = 3;
  // Provider-specific signature/attestation (optional).
  optional string signature = 4;
}

// Tool invocation parameters are bounded; use artifacts for large inputs.
message ToolInvocation {
  string tool_name = 1;
  optional string tool_call_id = 2;
  string input_preview = 3;
  ArtifactRef input_artifact = 4;
}

// Live-only session event record (NOT persisted).
//
// These are best-effort UX affordances (e.g. streaming deltas). They are delivered to active
// subscribers but are not written to the durable session event log.
message SessionLiveEvent {
  // Wall-clock timestamp (informational).
  google.protobuf.Timestamp created_at = 1;
  // SessionId (ULID bytes, length = 16).
  bytes session_id = 2;
  // Best-effort turn identifier (optional).
  optional string turn_id = 3;
  // Provider-defined item identifier (optional).
  optional string item_id = 4;

  oneof kind {
    AssistantMessageDelta assistant_message_delta = 10;
    ToolOutputDelta tool_output_delta = 11;
    AssistantReasoningSummaryPartAdded assistant_reasoning_summary_part_added = 12;
    AssistantReasoningSummaryDelta assistant_reasoning_summary_delta = 13;
    AssistantReasoningRawDelta assistant_reasoning_raw_delta = 14;
    UnknownSessionLiveEvent unknown = 100;
  }
}

message AssistantMessageDelta {
  string delta = 1;
}

message AssistantReasoningSummaryPartAdded {
  int64 summary_index = 1;
}

message AssistantReasoningSummaryDelta {
  int64 summary_index = 1;
  string delta = 2;
}

message AssistantReasoningRawDelta {
  int64 content_index = 1;
  string delta = 2;
}

message ToolOutputDelta {
  string tool_name = 1;
  string delta = 2;
}

// Forward-compatible placeholder for live-event union fallbacks.
message UnknownSessionLiveEvent {
  string event_type = 1;
  bytes json_payload = 2;
}

// Tool results are bounded; use artifacts for large outputs.
message ToolResult {
  string tool_name = 1;
  optional string tool_call_id = 2;
  string output_preview = 3;
  ArtifactRef output_artifact = 4;
  ErrorEnvelope error = 5;
}

enum TurnState {
  TURN_STATE_UNSPECIFIED = 0;
  TURN_STATE_RUNNING = 1;
  TURN_STATE_BLOCKED = 2;
  TURN_STATE_COMPLETED = 3;
}

// Status updates are compact; do not embed full logs or diffs.
message StatusUpdate {
  TurnState turn_state = 1;
  optional bool blocking = 2;
  optional uint32 progress_percent = 3;
  optional string message = 4;
}

// How the session handles permission/approval requests.
enum PermissionsMode {
  PERMISSIONS_MODE_UNSPECIFIED = 0;
  PERMISSIONS_MODE_ASK = 1;
  PERMISSIONS_MODE_AUTO_APPROVE = 2;
  PERMISSIONS_MODE_DENY = 3;
}

// A change in the session's effective permissions mode.
message PermissionsModeChanged {
  PermissionsMode mode = 1;
}

message CommandExecutionPermissionRequest {
  optional string command = 1;
  optional string cwd = 2;
  optional string reason = 3;
}

message FileChangePermissionRequest {
  optional string grant_root = 1;
  optional string reason = 2;
}

message PermissionRequest {
  oneof kind {
    CommandExecutionPermissionRequest command_execution = 1;
    FileChangePermissionRequest file_change = 2;
    UnknownPermissionRequest unknown = 100;
  }
}

message UnknownPermissionRequest {
  string kind = 1;
  bytes json_payload = 2;
}

enum PermissionDecision {
  PERMISSION_DECISION_UNSPECIFIED = 0;
  PERMISSION_DECISION_APPROVE = 1;
  PERMISSION_DECISION_DENY = 2;
}

enum PermissionDecisionBy {
  PERMISSION_DECISION_BY_UNSPECIFIED = 0;
  PERMISSION_DECISION_BY_USER = 1;
  PERMISSION_DECISION_BY_MODE_AUTO_APPROVE = 2;
  PERMISSION_DECISION_BY_MODE_AUTO_DENY = 3;
  PERMISSION_DECISION_BY_TIMEOUT = 4;
}

message PermissionRequested {
  // A stable identifier for correlating request/decision events.
  string request_id = 1;
  // A compact, user-facing summary of what is being approved.
  string summary = 2;
  PermissionRequest request = 3;
}

message PermissionDecided {
  string request_id = 1;
  PermissionDecision decision = 2;
  PermissionDecisionBy decided_by = 3;
}

// Tie an out-of-band artifact to a session and (optionally) a turn.
message ArtifactEmitted {
  ArtifactRef artifact = 1;
  optional string label = 2;
}

// Forward-compatible placeholder for session event union fallbacks (T-14).
message UnknownSessionEvent {
  // Stable session event type identifier.
  string event_type = 1;
  // Best-effort JSON payload for diagnostics/legacy rendering.
  bytes json_payload = 2;
}
