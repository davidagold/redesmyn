[alembic]
script_location = redesmyn/db/alembic
prepend_sys_path = .
version_path_separator = os

# Default dev DB (repo-root-relative). Override via `REDESMYN_DB_URL`.
sqlalchemy.url = sqlite:///./.redesmyn/redesmyn.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

